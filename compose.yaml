services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - booking-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
  tests:
    build: .
    profiles: ["test"]
    command: ["python", "scripts/run_tests.py", "--output-dir", "/app/evidence/latest"]
    volumes:
      - ./evidence:/app/evidence
volumes:
  booking-data:
